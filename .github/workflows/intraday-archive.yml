name: Intraday Market Archive

on:
  workflow_dispatch:
  # External scheduler invokes workflow_dispatch; native schedule intentionally disabled.

permissions:
  contents: read

concurrency:
  group: intraday-market-archive
  cancel-in-progress: false
  # Default single-pending behavior replaces old pending runs, not active work.

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-daily.txt
      - run: pip install -r requirements-daily.txt
      - name: Collect Public market data into private Supabase archive
        env:
          PUBLIC_API_SECRET: ${{ secrets.PUBLIC_API }}
          PUBLIC_ACCOUNT_NUMBER: ${{ secrets.PUBLIC_ACCOUNT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_API }}
        run: timeout --signal=TERM --kill-after=10s 720s python -u -m scripts.run_intraday_snapshot
