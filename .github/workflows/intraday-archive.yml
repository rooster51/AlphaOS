name: Intraday Market Archive

on:
  workflow_dispatch:
  schedule:
    # Registered 5-minute heartbeat. Broad UTC window covers NYSE regular
    # hours in both EST and EDT; Python exchange-calendar gating rejects
    # holidays, premarket, after-hours, and early-close overflow.
    - cron: "*/5 13-21 * * 1-5"

permissions:
  contents: read

concurrency:
  group: intraday-market-archive
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-daily.txt
      - name: Collect Public market data into private Supabase archive
        env:
          PUBLIC_API_SECRET: ${{ secrets.PUBLIC_API }}
          PUBLIC_ACCOUNT_NUMBER: ${{ secrets.PUBLIC_ACCOUNT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_API }}
        run: python -m scripts.run_intraday_snapshot
