name: Intraday Market Archive

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. These windows intentionally cover the U.S. regular
    # session across EDT/EST; the script itself will be hardened with an
    # exchange-calendar/session gate before automatic collection is enabled.
    # Kept manual-only in v1 until that gate and API cadence are verified.
    # - cron: "*/5 13-21 * * 1-5"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-daily.txt
      - name: Collect Public snapshot
        env:
          PUBLIC_API_SECRET: ${{ secrets.PUBLIC_API_SECRET }}
          PUBLIC_ACCOUNT_NUMBER: ${{ secrets.PUBLIC_ACCOUNT_NUMBER }}
        run: python scripts/run_intraday_snapshot.py
      - name: Commit observations
        run: |
          git config user.name "alphaos-archive"
          git config user.email "actions@users.noreply.github.com"
          git add data/intraday
          git diff --cached --quiet || git commit -m "archive intraday market snapshot"
          git push
