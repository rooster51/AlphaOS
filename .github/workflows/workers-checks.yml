name: Workers checks

on:
  pull_request:
    paths: ['web/**', '.github/workflows/workers-checks.yml']
  push:
    branches: [main, codex/cloudflare-workers]
    paths: ['web/**', '.github/workflows/workers-checks.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      CI: 'true'
      ALPHAOS_TEST_WORKERS: 'true'
      ALPHAOS_DEMO_MODE: 'false'
      ALPHAOS_API_TOKEN: ''
      ALPHAOS_API_URL: ''
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run cf-typegen
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:vinext
        env:
          ALPHAOS_API_TOKEN: alphaos-build-only-credential-canary
      - run: node scripts/check-worker-assets.mjs
      # Packaging only: no Cloudflare credentials or remote deployment in Actions.
      - run: npm run check:workers
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: workers-test-results
          path: web/test-results
