name: Read-only index capability audit
on:
  push:
    branches: [phase9-index-support]
    paths:
      - scripts/audit_public_indices.py
      - .github/workflows/index-capability-audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install publicdotcom-py==0.1.17
      - name: Read-only SPX and XSP capability audit
        env:
          PYTHONPATH: ${{ github.workspace }}
          PUBLIC_API_SECRET: ${{ secrets.PUBLIC_API }}
          PUBLIC_ACCOUNT_NUMBER: ${{ secrets.PUBLIC_ACCOUNT }}
        run: python scripts/audit_public_indices.py
