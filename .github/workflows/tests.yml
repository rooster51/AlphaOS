name: tests

on:
  push:
    branches:
      - phase5-option-economics
      - phase6-price-structure
      - strategy-selector-quant-workflow
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run full regression suite
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q
