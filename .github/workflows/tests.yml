name: tests

on:
  push:
    branches:
      - phase5-option-economics
      - phase6-price-structure
      - strategy-selector-quant-workflow
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'
          cache: pip
      # The authentication integration test runs the real Worker TypeScript
      # exchange against the local Python API with synthetic credentials only.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-api.txt
          pip install pytest
      - name: Run full regression suite
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit all dependencies
        run: npm audit --audit-level=moderate
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          ALPHAOS_DEMO_MODE: 'false'
          ALPHAOS_API_TOKEN: ''
      - run: npm run test:e2e

  windows-password-input:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      # Offline terminal-reader tests use only Node built-ins: no install,
      # credentials, generated secrets or deployment commands.
      - name: Windows hidden input regression (PowerShell)
        shell: pwsh
        run: node --test web/tests/hidden-input.test.mjs web/tests/windows-hidden-input.test.mjs
      - name: Windows hidden input regression (Command Prompt)
        shell: cmd
        run: node --test web/tests/hidden-input.test.mjs web/tests/windows-hidden-input.test.mjs

  website-login-rate-limit-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'
      - name: Install PostgreSQL test driver
        run: python -m pip install 'psycopg[binary]>=3.2,<4' pytest
      - name: Test shared limiter migration and concurrency
        env:
          WEBSITE_LOGIN_LIMITER_TEST_DSN: postgresql://postgres:postgres@localhost:5432/postgres
        run: python -m pytest -q tests/test_website_login_rate_limit_postgres.py
