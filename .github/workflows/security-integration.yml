name: security-integration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: alphaos_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alphaos_security_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: local-test-only
      PGDATABASE: alphaos_security_test
    steps:
      - uses: actions/checkout@v5
      - name: Prepare disposable Auth compatibility harness
        run: psql -v ON_ERROR_STOP=1 -f tests/security/sql/local_auth_harness.sql
      - name: Apply ledger schema to disposable database only
        run: psql -v ON_ERROR_STOP=1 -f supabase/alphaos2_trade_ledger.sql
      - name: Verify cross-user row-level security
        run: psql -v ON_ERROR_STOP=1 -f tests/security/sql/ledger_rls.sql
